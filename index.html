<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GFS Wave Forecast - Global Wave Animation</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a1929;
            color: #fff;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 25, 41, 0.95);
            border: 2px solid #1e88e5;
            border-radius: 12px;
            padding: 20px;
            max-width: 350px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .info-panel h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #64b5f6;
            font-weight: 600;
        }

        .info-panel h2 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #81c784;
            font-weight: 500;
        }

        .subtitle {
            font-size: 13px;
            color: #90caf9;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 3px solid #1e88e5;
        }

        .forecast-data {
            display: none;
        }

        .forecast-data.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .location-info {
            background: rgba(30, 136, 229, 0.15);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            color: #90caf9;
            font-size: 13px;
        }

        .data-value {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .wave-height {
            font-size: 28px;
            font-weight: 700;
            color: #64b5f6;
            text-align: center;
            margin: 15px 0;
        }

        .wave-height .unit {
            font-size: 16px;
            color: #90caf9;
            font-weight: 400;
        }

        .timestamp {
            text-align: center;
            font-size: 12px;
            color: #81c784;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend {
            position: absolute;
            bottom: 40px;
            left: 20px;
            background: rgba(10, 25, 41, 0.95);
            border: 2px solid #1e88e5;
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .legend h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #64b5f6;
        }

        .legend-scale {
            display: flex;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .legend-scale div {
            flex: 1;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #90caf9;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 25, 41, 0.95);
            padding: 30px 50px;
            border-radius: 12px;
            border: 2px solid #1e88e5;
            z-index: 2000;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            border: 3px solid rgba(100, 181, 246, 0.3);
            border-top: 3px solid #64b5f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(229, 57, 53, 0.2);
            border: 1px solid #e53935;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }

        .error.active {
            display: block;
        }

        /* Leaflet marker customization */
        .selected-marker {
            background: #1e88e5;
            border: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            box-shadow: 0 0 15px rgba(30, 136, 229, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading GFS Wave Data...</div>
    </div>

    <div class="info-panel">
        <h1>GFS Wave Forecast</h1>
        <div class="subtitle">Global Wave Particle Animation</div>

        <div class="instructions">
            Click anywhere on the map to see detailed wave forecast data for that location.
        </div>

        <div class="forecast-data" id="forecastData">
            <h2>Location Data</h2>
            <div class="location-info" id="locationInfo"></div>

            <div class="wave-height" id="waveHeight"></div>

            <div id="waveDetails"></div>

            <div class="timestamp" id="timestamp"></div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <div class="legend">
        <h3>Wave Height (m)</h3>
        <div class="legend-scale">
            <div style="background: #313695;"></div>
            <div style="background: #4575b4;"></div>
            <div style="background: #74add1;"></div>
            <div style="background: #abd9e9;"></div>
            <div style="background: #e0f3f8;"></div>
            <div style="background: #fee090;"></div>
            <div style="background: #fdae61;"></div>
            <div style="background: #f46d43;"></div>
            <div style="background: #d73027;"></div>
            <div style="background: #a50026;"></div>
        </div>
        <div class="legend-labels">
            <span>0</span>
            <span>2</span>
            <span>4</span>
            <span>6</span>
            <span>8+</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Velocity -->
    <script src="https://unpkg.com/leaflet-velocity@1.9.0/dist/leaflet-velocity.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
